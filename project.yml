name: PhotoNAS
options:
  bundleIdPrefix: com.photonas
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  libwebp:
    url: https://github.com/SDWebImage/libwebp-Xcode.git
    from: 1.2.4
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: "NO"
    ALWAYS_SEARCH_USER_PATHS: "NO"
    CLANG_ENABLE_MODULES: "YES"
targets:
  PhotoNAS:
    type: application
    platform: iOS
    sources:
      - path: PhotoNAS
    dependencies:
      - package: libwebp
        product: libwebp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.photonas.app
        PRODUCT_NAME: PhotoNAS
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "12"
    info:
      path: PhotoNAS/Info.plist
      properties:
        CFBundleDisplayName: PhotoNAS
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "12"
        MinimumOSVersion: "16.0"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: PhotoNAS 需要读取相册，把照片与视频通过局域网分享给同网络下的设备。照片不会被上传到任何服务器。
        NSLocalNetworkUsageDescription: PhotoNAS 需要局域网权限，用于启动照片 NAS 服务并在同一 Wi-Fi 下自动被发现。
        NSBonjourServices:
          - _photonas._tcp
          - _photonas._udp
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
